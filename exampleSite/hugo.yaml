baseurl: "/"
locale: "en-us"
defaultContentLanguage: "en"
# defaultContentLanguage: "zh"
title: "Marginalia"
theme: "hugo-marginalia"

pagination:
  pagerSize: 6

permalinks:
  post: "/post/:year/:month/:day/:slug/"

outputs:
  home: [html, rss, json]

menu:
  header:
    - name: Demos
      url: "demo/"
    - name: Search
      url: "#"
      identifier: menu-search
    - name: Subscribe
      url: "index.xml"
  footer:
    - name: Contact
      url: "404.html"
      weight: 1
    - name: Categories
      url: "categories/"
      weight: 2
      pre: "optional"
    - name: Tags
      url: "tags/"
      weight: 3
      pre: "optional"
    - name: Suggest an edit
      # automatically disabled unless params.editLink is set
      url: "#"
      weight: 4
      identifier: "menu-edit"
    - name: Back to top
      url: "#"

params:
  homePosts: 6
  mainSections: ["post", "work"]
  # editLink: "https://github.com/chrisrmiller/hugo-marginalia/edit/main/exampleSite/content/"
  authorDelimiter: " / "
  stickyMenu: false
  description: >
    A Hugo theme for technical blogs and journals.
  footer: >
    &copy; Your name here.
  license: >
    Text and figures are licensed under [Creative Commons Attribution CC BY
    4.0](https://creativecommons.org/licenses/by/4.0/). The source code is
    licensed under MIT. The full source is available at
    https://github.com/chrisrmiller/hugo-marginalia.

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: false # TODO C10b: drop this (default true), and add noClasses:false, lineNos
